name: Construire et tester
on: [push, pull_request, workflow_dispatch]
jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - run: npm test
      # Le fichier prêt à jouer, téléchargeable depuis la page de l'exécution (onglet Actions)
      - uses: actions/upload-artifact@v4
        with:
          name: IndoorGolfCareer
          path: dist/IndoorGolfCareer.html
